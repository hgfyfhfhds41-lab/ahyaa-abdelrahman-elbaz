name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
  EXPO_PUBLIC_OAUTH_PORTAL_URL: ${{ secrets.EXPO_PUBLIC_OAUTH_PORTAL_URL }}
  EXPO_PUBLIC_OAUTH_SERVER_URL: ${{ secrets.EXPO_PUBLIC_OAUTH_SERVER_URL }}
  EXPO_PUBLIC_APP_ID: ${{ secrets.EXPO_PUBLIC_APP_ID }}
  EXPO_PUBLIC_OWNER_OPEN_ID: ${{ secrets.EXPO_PUBLIC_OWNER_OPEN_ID }}
  EXPO_PUBLIC_OWNER_NAME: ${{ secrets.EXPO_PUBLIC_OWNER_NAME }}

jobs:
  build-debug-apk:
    name: Build installable Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required build secrets
        run: |
          missing=0
          for name in YOUTUBE_API_KEY EXPO_PUBLIC_API_BASE_URL EXPO_PUBLIC_OAUTH_PORTAL_URL EXPO_PUBLIC_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions Secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Prepare Android debug certificate identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          cert_sha1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ -z "$cert_sha1" ]; then echo "::error::Unable to determine Android debug certificate SHA-1"; exit 1; fi
          echo "ANDROID_CERT_SHA1=$cert_sha1" >> "$GITHUB_ENV"
          echo "Android debug certificate SHA-1: $cert_sha1"

      - name: Validate TypeScript
        run: pnpm check

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahyaa-abdelrahman-elbaz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
